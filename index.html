<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKUST SIS Course Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.3.5/dist/style.css">
<style>
:root{
  --bg:#eef1f7; --card:#ffffff; --line:#e2e7f0; --ink:#182036; --muted:#65708c;
  --accent:#2456e6; --accent2:#dbe5fd; --ok:#0e9f6e; --bad:#e02424; --amber:#9a5b13;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-width:860px}
.app-header{display:flex;align-items:center;gap:10px;padding:8px 18px;min-height:56px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);z-index:30;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.brand{font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.4px}
.header-status{display:flex;gap:8px;margin-left:8px}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:#eef2f7;color:#46536e;font-size:11.5px;font-weight:600;white-space:nowrap}
.status-pill.ok{background:#e7f8f0;color:#0c7a4d}
.status-pill.bad{background:#fdeaea;color:#b91c1c}
.spacer{flex:1}
.hbtn{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.hbtn:hover{border-color:#c9d3e3;background:#f8fafd}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.primary:hover{background:#1d4ed8}
.hbtn.danger{color:#b91c1c}
.hbtn.danger:hover{background:#fdeaea;border-color:#f3c0c0}
.hbtn.file{position:relative;overflow:hidden}
.hfile{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.app-main{display:grid;grid-template-columns:360px minmax(520px,1fr) 430px;min-height:0;transition:grid-template-columns .18s ease}
.app-main.left-collapsed{grid-template-columns:44px minmax(520px,1fr) 430px}
.app-main.right-collapsed{grid-template-columns:360px minmax(520px,1fr) 44px}
.app-main.left-collapsed.right-collapsed{grid-template-columns:44px minmax(520px,1fr) 44px}
.left,.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.left{border-right:1px solid var(--line);background:var(--card)}
.right{border-left:1px solid var(--line);background:var(--card)}
.pane-head{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.pane-title{font-size:11.5px;font-weight:800;color:#3c4a66;letter-spacing:.4px;text-transform:uppercase}
.pane-head .spacer{flex:1}
.pane-toggle{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#46536e;font-size:16px;line-height:1;padding:0;flex:0 0 auto}
.pane-toggle:hover{border-color:#c7d3e8;background:#f8fafd}
.pane-rail{flex:1;width:100%;border:0;background:transparent;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:12px;letter-spacing:2px;color:#46536e;cursor:pointer;padding:16px 0}
.pane-rail:hover{background:#f5f7fb;color:var(--ink)}
.center{overflow:hidden;display:flex;flex-direction:column;padding:14px 16px;min-width:0}
.search-box{padding:12px 12px 8px;position:relative}
.search-box input{width:100%;padding:10px 32px 10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;outline:none}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,86,230,.12)}
.search-clear{position:absolute;right:22px;top:21px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px}
.search-clear:hover{color:var(--ink)}
.filters{padding:0 12px 8px}
.filter-row{display:flex;gap:6px;margin-bottom:6px}
.filter-row select{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:12px;color:var(--ink)}
.filter-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,86,230,.12)}
.filter-row input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:12px;color:var(--ink)}
.filter-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,86,230,.12)}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{border:1px solid var(--line);background:#fff;color:#46536e;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;line-height:1.2}
.fchip:hover{border-color:#c7d3e8;background:#f8fafd}
.fchip.on{background:var(--accent2);border-color:#b7c8ea;color:#1d4ed8}
.filter-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.filter-clear{border:0;background:none;color:var(--accent);font-size:11.5px;font-weight:700;padding:0}
.filter-clear:disabled{color:#b7becc;cursor:default}
.filter-count{font-size:11px;color:var(--muted);font-weight:600}
.left-scroll{flex:1;overflow-y:auto;padding:4px 12px 16px}
.list-hint{font-size:11.5px;color:var(--muted);padding:6px 4px 8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.course-card[draggable=true]{cursor:grab}
.course-card:hover{border-color:#c7d3e8;box-shadow:0 2px 6px rgba(16,24,40,.06)}
.cc-top{display:flex;align-items:center;gap:8px}
.cc-code{font-weight:800;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cc-credits{margin-left:auto;font-size:11px;color:var(--muted);background:#f0f3f8;padding:2px 7px;border-radius:999px;white-space:nowrap}
.cc-name{font-size:12.5px;color:#3c4a66;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.cc-secs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#3c4a66;margin-top:4px;line-height:1.45}
.cc-par{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:#9a5b13;background:#fdf3e7;padding:1px 6px;border-radius:999px}
.cc-career{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:#1d4ed8;background:#eef4ff;padding:1px 6px;border-radius:999px}
.comp-group{margin-bottom:12px}
.comp-head{display:flex;align-items:baseline;gap:8px;margin:4px 0 8px}
.comp-title{font-size:12px;font-weight:800;color:#182036}
.comp-note{font-size:11px;color:var(--muted)}
.sec-assoc{font-size:10.5px;color:var(--muted);background:#eef1f6;padding:1px 6px;border-radius:999px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.detail-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.detail-back{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;padding:0 0 6px}
.detail-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.detail-code{font-size:17px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.detail-name{font-size:13.5px;color:#3c4a66}
.detail-credits{font-size:12px;color:var(--muted)}
.detail-desc{font-size:12px;color:#56617a;margin-top:8px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.detail-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:#f0f3f8;color:#46536e}
.chip.prereq{background:#fdf3e7;color:#9a5b13;cursor:pointer}
.chip.prereq:hover{background:#fbe8cf}
.chip.coreq{background:#eef4ff;color:#1d4ed8}
.chip.equiv{background:#f0f8f1;color:#0c7a4d}
.detail-body{padding:10px 14px 14px}
.detail-sub{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 6px}
.sec-card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:#fbfcfe}
.sec-card[draggable=true]{cursor:grab}
.sec-card[draggable=true]:active{cursor:grabbing}
.sec-card.in-sched{border-color:#b7c8ea;background:#f3f7ff}
.sec-card.conf{border-color:#f3b7b7;background:#fff7f7}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-label{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sec-type{font-size:10.5px;color:var(--muted);background:#eef1f6;padding:1px 6px;border-radius:999px}
.sec-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.sec-badge.in{color:#1d4ed8;background:#dbe5fd}
.sec-badge.conf{color:#b91c1c;background:#fdeaea}
.mtg-row{font-size:12px;color:#3c4a66;padding:3px 0 3px 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mtg-day{font-weight:700;color:var(--ink);min-width:34px}
.mtg-tag{color:var(--muted)}
.tchr{position:relative;display:inline}
.tchr-name{color:#3c4a66;border-bottom:1px dashed #b7c0d4;cursor:default}
.tchr-name:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tchr-pop{position:fixed;z-index:80;min-width:220px;max-width:280px;background:#182036;color:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 10px 28px rgba(16,24,40,.28);font-size:12px;line-height:1.45;pointer-events:none}
.tchr-pop .tp-name{font-weight:800;font-size:13px}
.tchr-pop .tp-role{color:#b7c8ea;font-size:11px;margin:2px 0 6px}
.tchr-pop .tp-row{display:flex;gap:8px;color:#dbe3f2;margin-top:2px;word-break:break-all}
.tchr-pop .tp-k{color:#93a0bb;min-width:58px;flex:0 0 auto}
.tchr-pop .tp-empty{color:#93a0bb}
.sec-actions{display:flex;gap:8px;margin-top:7px}
.sbtn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
.sbtn:hover{border-color:#c7d3e8}
.sbtn.add{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.add:hover{background:#1d4ed8}
.sbtn.add:disabled{background:#aeb9d2;border-color:#aeb9d2;cursor:not-allowed}
.sbtn.rm{color:#b91c1c}
.sbtn.rm:hover{background:#fdeaea;border-color:#f3c0c0}
.no-sections{font-size:12px;color:var(--muted);padding:8px 2px}
.cal-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-title{font-weight:800;font-size:15px}
.cal-credits{display:inline-flex;align-items:baseline;gap:6px;padding:3px 9px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-weight:800;font-size:12.5px;white-space:nowrap}
.cal-credits small{font-weight:600;font-size:11px;color:#5a6580}
.cal-export{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer}
.cal-export:hover{border-color:var(--accent);color:var(--accent)}
.cal-export:disabled{opacity:.5;cursor:not-allowed}
.cal-hint{font-size:11.5px;color:var(--muted)}
.cal-hint.bad{color:#b91c1c;font-weight:700}
.cal-legend{margin-left:auto;display:flex;gap:10px;font-size:11px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cal{flex:1;min-height:0;display:grid;grid-template-columns:70px repeat(5,1fr);grid-template-rows:40px repeat(14,56px);overflow:auto;position:relative;background:#fff}
.cal-corner{grid-column:1;grid-row:1;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#f6f8fb}
.cal-dayhead{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#46536e;background:#f6f8fb;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal-time{grid-column:1;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 8px 0 0;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.cal-line{grid-column:2 / -1;border-top:1px solid #eef1f6;z-index:1;pointer-events:none}
.cal-col{z-index:0;pointer-events:none;border-right:1px solid #eef1f6}
.cal-col-hover{background:rgba(36,86,230,.07)}
.cal-block{grid-row:2 / -1;position:relative;margin:0 4px;border-radius:8px;border-left:4px solid;padding:3px 7px;font-size:11px;z-index:2;box-shadow:0 1px 2px rgba(16,24,40,.1);overflow:hidden;cursor:default}
.cal-block:hover{box-shadow:0 3px 8px rgba(16,24,40,.16);z-index:4}
.cal-block.movable{cursor:grab}
.cal-block.movable:active{cursor:grabbing}
.cal-block.dim{opacity:.28}
.xdrag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#46536e;user-select:none;white-space:nowrap}
.xdrag input{accent-color:var(--accent)}
.cal-ghost{grid-row:2 / -1;position:relative;margin:0;border-radius:8px;border:2px dashed;z-index:3;pointer-events:none;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 3px;overflow:hidden;box-sizing:border-box}
.cal-ghost.on{border-width:2.5px;box-shadow:0 0 0 1px currentColor;font-size:11px}
.cal-pop{position:fixed;z-index:90;min-width:240px;max-width:300px;background:#182036;color:#fff;border-radius:12px;padding:11px 12px;box-shadow:0 12px 30px rgba(16,24,40,.3);font-size:12px;line-height:1.45;pointer-events:none}
.cal-pop .cp-code{font-weight:800;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cal-pop .cp-name{color:#c9d4ea;margin:2px 0 7px}
.cal-pop .cp-row{display:flex;gap:8px;margin-top:2px;color:#dbe3f2}
.cal-pop .cp-k{color:#93a0bb;min-width:64px;flex:0 0 auto}
.cal-pop .cp-bad{color:#fecaca;margin-top:6px}
.cal-block-code{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.cal-block-sec{font-weight:600;opacity:.85}
.cal-block-room{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-block-conf{box-shadow:0 0 0 1.5px var(--bad);}
.cal-block-warn{position:absolute;top:2px;right:16px;color:#b91c1c;font-weight:800;font-size:11px}
.cal-block-x{position:absolute;top:1px;right:2px;border:0;background:transparent;color:inherit;opacity:0;font-size:10px;padding:1px 4px;border-radius:4px}
.cal-block:hover .cal-block-x{opacity:.85}
.cal-block-x:hover{opacity:1;background:rgba(0,0,0,.12)}
.cal-blocked{grid-row:2 / -1;position:relative;margin:0 4px;border-radius:8px;background:repeating-linear-gradient(135deg,rgba(220,38,38,.10) 0 8px,rgba(220,38,38,.20) 8px 16px);border:1.5px dashed rgba(220,38,38,.55);z-index:1;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(185,28,28,.9);letter-spacing:.5px;cursor:pointer}
.cal-blocked:hover{border-color:#b91c1c;background:repeating-linear-gradient(135deg,rgba(220,38,38,.16) 0 8px,rgba(220,38,38,.30) 8px 16px)}
.cal-sel{grid-row:2 / -1;position:relative;margin:0 4px;border-radius:8px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.5px}
.cal-sel.block{border:2px dashed rgba(220,38,38,.8);background:rgba(220,38,38,.14);color:#b91c1c}
.cal-sel.contains{border:2px dashed rgba(36,86,230,.85);background:rgba(36,86,230,.14);color:#1d4ed8}
.cal-ctx{position:fixed;z-index:120;min-width:280px;max-width:370px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(16,24,40,.18);padding:8px;font-size:12px}
.cal-ctx-head{padding:4px 8px 9px;font-weight:800;color:#334155;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:12.5px;line-height:1.4}
.cal-ctx-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.cal-ctx-item:hover{background:#f1f5ff}
.cal-ctx-item b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.cal-ctx-item span{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:normal}
.cal-ctx-none{padding:6px 8px;color:var(--muted)}
.cal-selecting{user-select:none;-webkit-user-select:none}
.cal-preview{grid-row:2 / -1;position:relative;margin:0 4px;border-radius:8px;border:2px dashed rgba(36,86,230,.85);background:rgba(36,86,230,.16);z-index:3;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1d4ed8;pointer-events:none;text-align:center;padding:0 4px}
.cal-preview-bad{border-color:var(--bad);background:rgba(224,36,36,.15);color:#b91c1c}
.cal-empty{grid-column:2 / -1;grid-row:2 / -1;display:flex;align-items:center;justify-content:center;color:#a6b0c4;font-size:13px;font-weight:600;letter-spacing:.3px;border:2px dashed #dbe2ee;border-radius:10px;margin:10px;background:#fbfcfe;z-index:1;pointer-events:none}
.tabs{display:flex;gap:6px;align-items:center;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tab{padding:7px 14px;border-radius:9px;border:1px solid transparent;background:transparent;font-weight:700;font-size:12.5px;color:#5a6580}
.tab:hover{background:#f1f4fa}
.tab.active{background:var(--accent2);color:var(--accent)}
.tab-body{flex:1;overflow-y:auto;padding:14px;min-height:0}
.sched-help{font-size:12px;color:var(--muted);margin-bottom:8px}
.mode-switch{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.mode-switch .mode-label{font-size:11.5px;font-weight:700;color:#5a6580}
.sol-metrics{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.metric{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#46536e;background:#eef2f7;border-radius:999px;padding:2px 8px}
.metric.good{background:#e7f8f0;color:#0c7a4d}
.metric.bad{background:#fdeaea;color:#b91c1c}
.sol-days{font-size:11px;color:var(--muted);margin-bottom:6px}
.save-group{display:flex;gap:6px;align-items:center}
.switch{position:relative;display:inline-flex;background:#eef2f7;border:1px solid var(--line);border-radius:999px;padding:2px}
.switch button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:#5a6580}
.switch button.on{background:#fff;color:#1d4ed8;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.switch-hint{font-size:11px;color:var(--muted)}
.sched-slot{flex:1 1 120px;min-width:0;max-width:100%;height:28px;border:1px solid var(--line);border-radius:7px;padding:0 6px;background:#fff;font-size:11.5px}
.sched-rows{display:flex;flex-direction:column;gap:8px}
.sched-row{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfcfe;min-width:0}
.sched-row.off{background:#f4f6fa;border-color:#e2e7f0;opacity:.75}
.sched-row-body{display:flex;gap:8px;min-width:0}
.sched-radio{flex:0 0 auto;width:30px;display:flex;align-items:center;justify-content:center}
.sched-radio button{width:18px;height:18px;border-radius:50%;border:2px solid #b7c0d4;background:#fff;padding:0;position:relative}
.sched-radio button:hover{border-color:var(--accent)}
.sched-radio button.on{border-color:var(--accent)}

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<script>

  Fragment: window.React.Fragment,
  jsx: function(type, props, key){ if (key != null){ props = Object.assign({}, props, {key: key}); } return window.React.createElement(type, props); },
  jsxs: function(type, props, key){ if (key != null){ props = Object.assign({}, props, {key: key}); } return window.React.createElement(type, props); }

<script src="https://unpkg.com/@xyflow/react@12.3.5/dist/umd/index.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
'use strict';

/* ================= constants ================= */
const START_HOUR = 8, END_HOUR = 21, HOUR_H = 56, HEADER_H = 40, TIME_COL = 70;
const DAY_NAMES = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const LS_KEY = 'hkust-course-planner-v1';
const MAX_SOLUTIONS = 6;
const COURSE_ONLY_COLLECT = 120;
const TRANSFER_GAP = 10 / 60;

function defaultPlanner(){
  return { mode: 'time', rank: 'even', items: [{ id: uid(), code: '', times: [], all: false, enabled: true }] };
}
function sanitizePlanner(raw){
  const p = raw || {};
  const wasOnly = p.mode === 'only';
  const items = (Array.isArray(p.items) ? p.items : []).map(it => ({
    id: uid(),
    code: normCode((it && it.code) || ''),
    all: wasOnly || !!(it && it.all),
    enabled: it && typeof it.enabled === 'boolean' ? it.enabled : true,
    times: ((it && it.times) || []).filter(t => t && t.day >= 1 && t.day <= 5 && isFinite(Number(t.time)))
      .map(t => ({ day: Number(t.day), time: Number(t.time), labels: t.labels || null }))
  }));
  if (!items.length) items.push({ id: uid(), code: '', times: [], all: false, enabled: true });
  return {
    mode: (p.mode === 'course' || wasOnly) ? 'course' : 'time',
    rank: p.rank === 'distance' ? 'distance' : 'even',
    items: items
  };
}
function sanitizeBlocked(arr){
  return (Array.isArray(arr) ? arr : []).map(b => ({
    id: uid(),
    day: Number(b && b.day),
    start: Number(b && b.start),
    end: Number(b && b.end)
  })).filter(b => b.day >= 1 && b.day <= 5 && isFinite(b.start) && isFinite(b.end) && b.end > b.start);
}
function loadPlannerState(){
  try{
    const parsed = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    return sanitizePlanner(parsed.planner);
  }catch(e){
    return defaultPlanner();
  }
}
function plannerForSave(planner){
  return {
    mode: planner.mode,
    rank: planner.rank,
    items: (planner.items || []).map(it => ({ code: it.code || '', times: it.times || [], all: !!it.all, enabled: it && typeof it.enabled === 'boolean' ? it.enabled : true }))
  };
}
function hydrateSchedule(arr, courseList){
  const ids = new Set();
  const byId = {};
  (courseList || []).forEach(c => c.sections.forEach(sec => { ids.add(sec.id); byId[sec.id] = { course: c, section: sec }; }));
  return (Array.isArray(arr) ? arr : []).filter(en => en && en.section && ids.has(en.section)).map(en => {
    const hit = byId[en.section];
    if (hit) return makeEntry(hit.course.code, hit.section);
    return { course: en.course, section: en.section, label: en.label || '', meetings: Array.isArray(en.meetings) ? en.meetings : [], component: en.component || '' };
  });
}
const CODE_RE = /[A-Za-z]{2,5}\s?\d{3,4}[A-Za-z]?/g;

/* ================= small helpers ================= */
const RF = window.ReactFlow || null;
function normCode(s){ return String(s || '').toUpperCase().replace(/\s+/g, ''); }
function toDec(hhmm){
  const p = String(hhmm || '').split(':').map(Number);
  if (p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return NaN;
  return p[0] + p[1] / 60;
}
function fmtDec(t){
  let h = Math.floor(t), m = Math.round((t - h) * 60);
  if (m === 60){ h += 1; m = 0; }
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function fmtRange(m){ return fmtDec(m.start) + '–' + fmtDec(m.end); }
function cleanTeacher(n){ return String(n || '').replace(/,\s*/g, ' ').replace(/\s+/g, ' ').trim(); }
function cleanField(v){ const s = String(v || '').trim(); return (s && s !== ' ') ? s : ''; }
function hashHue(s){ let h = 0; for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h % 360; }
function courseColor(code){
  const h = hashHue(code);
  return { bg: 'hsla(' + h + ',72%,92%,.92)', border: 'hsl(' + h + ',55%,45%)', text: 'hsl(' + h + ',48%,22%)' };
}
function sectionTint(index){
  const h = Math.round((Number(index) * 137.508) % 360);
  return {
    h: h,
    bg: 'hsla(' + h + ',78%,52%,.20)',
    bgOn: 'hsla(' + h + ',82%,48%,.38)',
    border: 'hsl(' + h + ',72%,40%)',
    text: 'hsl(' + h + ',72%,26%)'
  };
}
function truncate(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function summaryOf(meetings){
  if (!meetings || !meetings.length) return 'TBA';
  const m = meetings[0];
  let s = DAY_NAMES[m.day] + ' ' + fmtRange(m);
  if (meetings.length > 1) s += ' · +' + (meetings.length - 1) + ' more';
  return s;
}
let _uid = 0;
const uid = () => 'id-' + (++_uid);

/* ================= catalog (data.json) ================= */
function buildCatalog(raw){
  const map = {};
  for (const d of (raw || [])){
    const code = normCode(d.crseCode);
    if (!code) continue;
    const score = ['crsePrerequisite', 'crseCorequisite', 'crseDescr', 'crseTitle', 'equivCourseCode']
      .filter(k => { const v = d[k]; return v && String(v).trim() && String(v).trim() !== ' '; }).length;
    const cur = map[code];
    if (!cur || score > cur._score){ map[code] = Object.assign({}, d, {_score: score}); }
  }
  return map;
}

/* ================= normalizer (courses.json -> app model) ================= */
function normalizeCourse(c, catalogMap){
  const ci = c.courseInfo || {};
  const code = normCode(ci.crseCode);
  const cat = catalogMap[code] || {};
  const sections = (c.classSections || []).map(s => {
    const meetings = [];
    for (const m of (s.meetingInfoList || [])){
      const days = String(m.weekDay || '').split(',').map(x => parseInt(x, 10)).filter(x => x >= 1 && x <= 5);
      const start = toDec(m.meetingStartTime), end = toDec(m.meetingEndTime);
      if (!days.length || !isFinite(start) || !isFinite(end) || end <= start) continue;
      const instructors = [];
      const seenInst = {};
      for (const raw of (m.instructorList || [])){
        const name = cleanTeacher(raw.instructorName) || [cleanTeacher(raw.lastName), cleanTeacher(raw.firstName)].filter(Boolean).join(' ');
        if (!name) continue;
        const inst = {
          name: name,
          email: cleanField(raw.email),
          account: cleanField(raw.userAccount),
          role: cleanField(raw.instructorRoleIndEnDesc) || cleanField(raw.instructorRoleIndDesc),
          firstName: cleanField(raw.firstName),
          lastName: cleanField(raw.lastName)
        };
        const key = inst.name + '|' + inst.email + '|' + inst.account;
        if (seenInst[key]) continue;
        seenInst[key] = true;
        instructors.push(inst);
      }
      const teacher = instructors.map(x => x.name).join('; ');
      const room = String(m.facilityName || '').trim();
      const startDate = cleanField(m.startDate), endDate = cleanField(m.endDate);
      for (const day of days) meetings.push({ day: day, start: start, end: end, room: room, teacher: teacher, instructors: instructors, startDate: startDate, endDate: endDate });
    }
    meetings.sort((a, b) => a.day - b.day || a.start - b.start);
    const assoc = Number(s.associatedClass);
    return {
      id: s.classId || (code + '-' + s.classSection),
      label: s.classSection || s.classCode || '',
      type: s.ssrComponent || s.crseComponentName || '',
      component: s.ssrComponent || 'OTH',
      componentName: s.crseComponentName || s.ssrComponent || 'Section',
      associatedClass: isFinite(assoc) ? assoc : 0,
      optional: s.optionalComponent === 'Y',
      primary: s.primaryComponent === 'Y',
      capacity: s.enrollmentCapacity || 0,
      enrolled: s.enrollmentNbr || 0,
      meetings: meetings
    };
  });
  sections.sort((a, b) => a.component.localeCompare(b.component) || a.label.localeCompare(b.label, undefined, {numeric: true}));
  return {
    code: code,
    name: ci.crseName || '',
    credits: ci.totalCredits || 0,
    shortDesc: cleanField(ci.crseShortDesc),
    desc: cleanField(cat.crseDescr) || cleanField(ci.crseShortDesc),
    sections: sections,
    isMulti: ci.isMultiComponent === 'Y',
    associateMsg: cleanField(ci.associateMsg),
    subject: cleanField(ci.subjectArea) || (code.match(/^[A-Z]+/) || [''])[0],
    career: cleanField(ci.academicCareer) || cleanField((c.classSections && c.classSections[0] && c.classSections[0].careerId) || ''),
    prereq: cleanField(cat.crsePrerequisite),
    coreq: cleanField(cat.crseCorequisite),
    equiv: cleanField(cat.equivCourseCode),
    title: cleanField(cat.crseTitle)
  };
}
function normalizeCourses(raw, catalogMap){
  return (Array.isArray(raw) ? raw : []).map(c => normalizeCourse(c, catalogMap)).filter(c => c.code);
}

const COMP_MAP_KLMS = { 'Lecture': 'LEC', 'Laboratory': 'LAB', 'Tutorial': 'TUT', 'Seminar': 'SEM', 'Other': 'OTH' };
function normalizeKlmsCourses(raw, catalogMap){
  const out = [];
  for (const item of (Array.isArray(raw) ? raw : [])){
    const ci = item.courseInfo || {};
    const code = normCode(ci.crseCode);
    if (!code) continue;
    const cat = (catalogMap && catalogMap[code]) || {};
    const sections = [];
    const seenIds = new Set();
    for (const m of (item.courseModuleInfos || [])){
      const id = String(m.classId || '');
      if (!id || seenIds.has(id)) continue;
      seenIds.add(id);

  const others = (schedule || []).filter(en => en.course !== course.code);
  return courseBundles(course).map((bundle, i) => {
    const meetings = [];
    bundle.forEach(entry => (entry.meetings || []).forEach(m => meetings.push(Object.assign({ label: entry.label, component: entry.component }, m))));
    const conflicts = [];
    bundle.forEach(entry => findConflicts(entry.meetings, others).forEach(c => conflicts.push(c)));
    return {
      bundle: bundle,
      primary: bundle[0],
      label: bundle.map(e => e.label).join('+'),
      meetings: meetings,
      conflicts: conflicts,
      tint: sectionTint(i)
    };
  });
}
function meetingsOverlap(a, b){
  return a.day === b.day && a.start < b.end && b.start < a.end;
}
function layoutGhostOverlays(targets){
  const items = [];
  (targets || []).forEach((t, ti) => {
    (t.meetings || []).forEach((m, mi) => {
      items.push({ t: t, m: m, ti: ti, mi: mi, day: m.day, start: m.start, end: m.end, lane: 0, lanes: 1 });
    });
  });
  const byDay = {};
  items.forEach(it => { (byDay[it.day] || (byDay[it.day] = [])).push(it); });
  Object.keys(byDay).forEach(day => {
    const list = byDay[day];
    const seen = list.map(() => false);
    for (let i = 0; i < list.length; i++){
      if (seen[i]) continue;
      const stack = [i];
      seen[i] = true;
      const group = [];
      while (stack.length){
        const u = stack.pop();
        group.push(list[u]);
        for (let v = 0; v < list.length; v++){
          if (!seen[v] && meetingsOverlap(list[u], list[v])){ seen[v] = true; stack.push(v); }
        }
      }
      group.sort((a, b) => String(a.t.label).localeCompare(String(b.t.label), undefined, { numeric: true }) || a.start - b.start || a.ti - b.ti);
      group.forEach((it, idx) => { it.lane = idx; it.lanes = group.length; });
    }
  });
  return items;
}
function ghostSliceBox(it, originTop, rowH){
  const lanes = Math.max(1, it.lanes || 1);
  const lane = it.lane || 0;
  return {
    top: originTop + (it.start - START_HOUR) * rowH + 4,
    height: Math.max(8, (it.end - it.start) * rowH - 8),
    leftPct: (lane / lanes) * 100,
    widthPct: 100 / lanes,
    lane: lane,
    lanes: lanes
  };
}
function pickTarget(targets, e, el){
  const metrics = calendarMetrics(el);
  const cell = pointerCell(e, el);
  if (!metrics || !cell) return null;
  const dayBox = metrics.days[cell.day - 1];
  if (!dayBox || dayBox.width <= 0) return null;
  const xRatio = (e.clientX - dayBox.left) / dayBox.width;
  const hits = layoutGhostOverlays(targets).filter(it => {
    if (it.day !== cell.day) return false;
    const box = ghostSliceBox(it, metrics.originTop, metrics.rowH);
    if (e.clientY < box.top || e.clientY >= box.top + box.height) return false;
    const lane = Math.max(0, Math.min(box.lanes - 1, Math.floor(xRatio * box.lanes)));
    return lane === box.lane;
  });
  if (!hits.length) return null;
  hits.sort((a, b) => (a.t.conflicts.length ? 1 : 0) - (b.t.conflicts.length ? 1 : 0) || a.lanes - b.lanes);
  return hits[0].t;
}
function generateSchedules(input, coursesById, opts){
  opts = opts || {};
  const collectLimit = Math.max(1, opts.collectLimit || MAX_SOLUTIONS);
  const showLimit = Math.max(1, opts.showLimit || MAX_SOLUTIONS);
  const rankBy = opts.rankBy === 'distance' ? 'distance' : 'even';
  const locked = (opts.locked || []).map(cloneEntry);
  const requests = normalizeSchedRequests(input);
  const reqCodes = {};
  requests.forEach(r => { if (r.code) reqCodes[r.code] = true; });
  const lockedForConflict = locked.filter(e => !(e.course && reqCodes[e.course]));
  const warnings = [];
  const pool = [];
  let kept = 0;
  for (const req of requests){
    const code = req.code;
    const onTimetable = locked.some(e => e.course === code);
    if (onTimetable){
      kept++;
      warnings.push(code + ': already on the timetable — regenerating will replace its current sections');
    }
    const c = coursesById[code];
    if (!c){ warnings.push(code + ': not offered this term (no class sections)'); continue; }
    let bundles = courseBundles(c);
    const before = bundles.length;
    if (!before){
      warnings.push(code + ': no valid section combination (Lecture/Tutorial pairing has no conflict-free option)');
      continue;
    }
    if (req.times && req.times.length){
      bundles = bundles.filter(b => bundleCoversTimes(b, req.times));
      const label = req.times.map(t => DAY_NAMES[t.day] + ' ' + fmtDec(t.time)).join(' + ');
      if (!bundles.length){
        warnings.push(code + ': no section covers ' + label + ' (' + before + ' bundle(s) before time filter)');
        continue;
      }
      warnings.push(code + ': time filter ' + label + ' → ' + bundles.length + '/' + before + ' section bundle(s)');
    }
    if (opts.blocked && opts.blocked.length){
      const beforeB = bundles.length;
      bundles = bundles.filter(bundle => !bundle.some(entry => (entry.meetings || []).some(m => meetingInRanges(m, opts.blocked))));
      if (bundles.length !== beforeB){
        warnings.push(code + ': blocked periods exclude ' + (beforeB - bundles.length) + '/' + beforeB + ' section bundle(s)');
        if (!bundles.length) continue;
      }
    }
    bundles = bundles.filter(bundle => !bundle.some(entry => findConflicts(entry.meetings, lockedForConflict).length));
    if (!bundles.length){
      warnings.push(code + ': every section bundle conflicts with the current timetable');
      continue;
    }
    const nPar = parallelClassCount(c);
    if (nPar > 1) warnings.push(code + ': ' + bundles.length + ' feasible section bundle(s)');
    pool.push({ code: code, name: c.name, bundles: bundles });
  }
  if (!pool.length) return { solutions: [], warnings: warnings, truncated: false, rankBy: rankBy, kept: kept };
  pool.sort((a, b) => a.bundles.length - b.bundles.length);
  const solutions = [];
  const chosen = lockedForConflict.slice();
  const baseLen = lockedForConflict.length;
  let nodes = 0;
  const MAX_NODES = 400000;
  let truncated = false;
  function bt(i){
    nodes++;
    if (nodes > MAX_NODES){ truncated = true; return; }
    if (i === pool.length){
      solutions.push({ added: chosen.slice(baseLen).map(cloneEntry), full: chosen.map(cloneEntry) });
      return;
    }
    for (const bundle of pool[i].bundles){
      let ok = true;
      for (const entry of bundle){
        if (findConflicts(entry.meetings, chosen).length){ ok = false; break; }
      }
      if (!ok) continue;
      const n = bundle.length;
      for (const entry of bundle) chosen.push(entry);
      bt(i + 1);
      chosen.length -= n;
      if (solutions.length >= collectLimit || truncated) return;
    }
  }
  bt(0);
  const scored = sortScored(solutions.map(s => {
    const sc = scoreTimetable(s.full);
    sc.entries = s.added;
    sc.full = s.full;
    return sc;
  }), rankBy);
  return { solutions: scored.slice(0, showLimit), warnings: warnings, truncated: truncated, rankBy: rankBy, found: solutions.length, kept: kept };
}

/* ================= graph layout for dependency AST ================= */
function buildGraphData(courseCode, courseName, ast, names){
  const nodes = [], edges = [];
  let seq = 0;
  const addNode = (type, data, pos) => { const id = 'n' + (++seq); nodes.push({ id: id, type: type, data: data, position: pos }); return id; };
  const addEdge = (s, t) => edges.push({ id: 'e' + (++seq), source: s, target: t });

  const XS = 190, YS = 140, shiftY = 90;
  const astPos = new Map();
  const leaves = [];
  (function collect(n){
    if (n.children && n.children.length) n.children.forEach(collect);
    else leaves.push(n);
  })(ast);
  const depthOf = new Map();
  (function setDepth(n, d){ depthOf.set(n, d); if (n.children) n.children.forEach(c => setDepth(c, d + 1)); })(ast, 1);
  leaves.forEach((n, i) => astPos.set(n, { x: i * XS, y: depthOf.get(n) * YS + shiftY }));
  (function place(n){
    if (n.children && n.children.length){
      n.children.forEach(place);
      const xs = n.children.map(c => astPos.get(c).x);
      astPos.set(n, { x: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, y: depthOf.get(n) * YS + shiftY });
    }
  })(ast);

  const totalW = Math.max(1, leaves.length) * XS;
  const rootId = addNode('course', { label: courseCode, code: courseCode, name: courseName || '' }, { x: totalW / 2 - XS / 2, y: 0 });
  const idOf = new Map();
  (function build(n){
    if (idOf.has(n)) return idOf.get(n);
    let id;
    if (n.kind === 'code') id = addNode('course', { label: n.label || n.code, code: n.code, name: names[n.code] || '' }, astPos.get(n));
    else if (n.kind === 'note') id = addNode('note', { label: n.label, code: null }, astPos.get(n));
    else id = addNode('op', { label: n.kind.toUpperCase() }, astPos.get(n));
    idOf.set(n, id);
    if (n.children) n.children.forEach(ch => addEdge(id, build(ch)));
    return id;
  })(ast);
  return { nodes: nodes, edges: edges };
}

function DepGraph({ courseCode, courseName, ast, names, onJump }){
  const data = React.useMemo(() => buildGraphData(courseCode, courseName, ast, names), [courseCode, courseName, ast, names]);
  const [nodes, setNodes] = React.useState(data.nodes);
  const [edges] = React.useState(data.edges);

function SimpleSvgTree({ data, onJump }){
  const [view, setView] = React.useState({ x: 0, y: 0, k: 1 });
  const dragRef = React.useRef(null);
  const onPointerDown = (e) => { dragRef.current = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y }; e.currentTarget.setPointerCapture(e.pointerId); };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    setView(v => ({ ...v, x: dragRef.current.vx + e.clientX - dragRef.current.sx, y: dragRef.current.vy + e.clientY - dragRef.current.sy }));
  };
  const onPointerUp = () => { dragRef.current = null; };
  const onWheel = (e) => {
    e.preventDefault();
    setView(v => ({ ...v, k: Math.min(2.5, Math.max(0.3, v.k * (e.deltaY < 0 ? 1.12 : 0.89))) }));
  };
  if (!data.nodes.length){
    return <div className="dep-canvas"><div className="dep-note">Nothing to draw.</div></div>;
  }
  const xs = data.nodes.map(n => n.position.x), ys = data.nodes.map(n => n.position.y);
  const minX = Math.min.apply(null, xs) - 80, maxX = Math.max.apply(null, xs) + 220;
  const minY = Math.min.apply(null, ys) - 60, maxY = Math.max.apply(null, ys) + 110;
  const W = maxX - minX, H = maxY - minY;
  return (
    <div className="dep-canvas">
      <svg className="svg-tree" viewBox={minX + ' ' + minY + ' ' + W + ' ' + H}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onWheel={onWheel}
        style={{ cursor: 'grab' }}>
        <g transform={'translate(' + view.x + ' ' + view.y + ') scale(' + view.k + ')'}>
          {data.edges.map(e => {
            const s = data.nodes.find(n => n.id === e.source), t = data.nodes.find(n => n.id === e.target);
            if (!s || !t) return null;
            const x1 = s.position.x + 90, y1 = s.position.y + (s.type === 'course' ? 36 : 22);
            const x2 = t.position.x + 90, y2 = t.position.y;
            return <line key={e.id} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="4 3" />;
          })}
          {data.nodes.map(n => {
            if (n.type === 'op'){
              return (
                <g key={n.id} transform={'translate(' + n.position.x + ' ' + n.position.y + ')'}>
                  <rect width="64" height="26" rx="13" fill="#111827" />
                  <text x="32" y="17" fontSize="11" fontWeight="800" fill="#fff" textAnchor="middle">{n.data.label}</text>
                </g>
              );
            }
            if (n.type === 'note'){
              return (
                <g key={n.id} transform={'translate(' + n.position.x + ' ' + n.position.y + ')'}>
                  <rect width="150" height="28" rx="8" fill="#fff8e8" stroke="#e9c46a" />
                  <text x="8" y="18" fontSize="10.5" fill="#7c5a10">{truncate(n.data.label, 20)}</text>
                </g>
              );
            }
            const col = courseColor(n.data.code || 'X');
            return (
              <g key={n.id} transform={'translate(' + n.position.x + ' ' + n.position.y + ')'} style={{ cursor: 'pointer' }}
                onClick={() => { if (n.data.code) onJump(n.data.code); }}>
                <rect width="180" height="42" rx="9" fill={col.bg} stroke={col.border} strokeWidth="1.3" />
                <text x="10" y="18" fontSize="12" fontWeight="800" fill={col.text}>{n.data.label}</text>
                {n.data.name ? <text x="10" y="32" fontSize="9.5" fill={col.text} opacity="0.85">{truncate(n.data.name, 24)}</text> : null}
              </g>
            );
          })}
        </g>
      </svg>
      <div className="svg-zoom">
        <button onClick={() => setView(v => ({ ...v, k: Math.min(2.5, v.k * 1.15) }))} title="Zoom in">+</button>
        <button onClick={() => setView(v => ({ ...v, k: Math.max(0.3, v.k * 0.87) }))} title="Zoom out">−</button>
        <button onClick={() => setView({ x: 0, y: 0, k: 1 })} title="Reset">reset</button>
      </div>
    </div>
  );
}

function ManualLoad({ onData }){
  const [files, setFiles] = React.useState({ courses: null, catalog: null, klms: null });
  const [err, setErr] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const fileName = { courses: 'courses.json', catalog: 'data.json', klms: 'courses_klms.json' };
  function readFile(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => { try { resolve(JSON.parse(r.result)); } catch (ex){ reject(ex); } };
      r.onerror = () => reject(new Error('read failed'));
      r.readAsText(file);
    });
  }
  async function onPick(key, e){
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setErr('');
    try{
      const data = await readFile(f);
      setFiles(prev => ({ ...prev, [key]: data }));
    }catch(ex){
      setErr((fileName[key] || key) + ' is not valid JSON: ' + ex.message);
    }
  }
  async function load(){
    if (!files.courses || !files.catalog){ setErr('Please select courses.json and data.json. courses_klms.json is optional.'); return; }
    setBusy(true);
    try{
      const catalogMap = buildCatalog(files.catalog);
      const sis = normalizeCourses(files.courses, catalogMap);
      if (!sis.length) throw new Error('no courses could be parsed');
      const kl = files.klms ? normalizeKlmsCourses(files.klms, catalogMap) : [];
      onData({
        courses: mergeCourses(sis, kl),
        catalogMap: catalogMap,
        rawCourses: files.courses,
        rawCatalog: files.catalog,
        rawKlms: files.klms || []
      });
    }catch(ex){
      setErr('Could not parse data: ' + ex.message);
      setBusy(false);
    }
  }
  return (
    <div className="screen"><div className="screen-card">
      <h2>📚 HKUST SIS Course Planner</h2>
      <p>Could not auto-load JSON from this folder. Select <code>courses.json</code> and <code>data.json</code> below; <code>courses_klms.json</code> (PE / general education) is optional.</p>
      <div className="file-row">
        <label>courses.json</label>
        <input type="file" accept=".json,application/json" onChange={(e) => onPick('courses', e)} />
        <span className="fstate">{files.courses ? '✓ loaded' : ''}</span>
      </div>
      <div className="file-row">
        <label>courses_klms.json <span style={{ fontWeight: 400, color: '#5a6580' }}>(optional)</span></label>
        <input type="file" accept=".json,application/json" onChange={(e) => onPick('klms', e)} />
        <span className="fstate">{files.klms ? '✓ loaded' : ''}</span>
      </div>
      <div className="file-row">
        <label>data.json</label>
        <input type="file" accept=".json,application/json" onChange={(e) => onPick('catalog', e)} />
        <span className="fstate">{files.catalog ? '✓ loaded' : ''}</span>
      </div>
      {err ? <div className="warn bad" style={{ textAlign: 'left' }}>{err}</div> : null}
      <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 12 }}>
        <button className="hbtn primary" onClick={load} disabled={busy}>{busy ? 'Loading…' : 'Load data'}</button>
        <button className="hbtn" onClick={() => window.location.reload()}>Try auto-load again</button>
      </div>
    </div></div>
  );
}

/* ================= search & detail ================= */
function searchCourses(courses, q){
  const query = String(q || '').trim().toLowerCase();
  if (!query) return courses;
  const scored = [];
  for (const c of courses){
    const code = c.code.toLowerCase(), name = c.name.toLowerCase();
    const short = c.shortDesc.toLowerCase(), desc = c.desc.toLowerCase();
    const labels = c.sections.map(s => (s.label || '').toLowerCase()).join(' ');
    let score = 0;
    if (code === query) score = 100;
    else if (code.startsWith(query)) score = 80;
    else if (code.includes(query)) score = 60;
    if (name.includes(query)) score = Math.max(score, 50);
    if (short.includes(query) || desc.includes(query)) score = Math.max(score, 30);
    if (labels.includes(query)) score = Math.max(score, 40);
    if (score) scored.push({ c: c, score: score });
  }
  scored.sort((a, b) => b.score - a.score || a.c.code.localeCompare(b.c.code));
  return scored.map(s => s.c);
}
const EMPTY_FILTERS = { subject: '', credits: '', career: '', days: [], slot: '', instructor: '', noConflict: false, available: false, hasParallel: false, hasLab: false, hasTut: false, hasPrereq: false };
function subjectOf(c){ return c.subject || ((c.code || '').match(/^[A-Z]+/) || [''])[0]; }
function careerOf(c){ return String((c && c.career) || '').toUpperCase(); }
function careerLabel(code){
  const k = String(code || '').toUpperCase();
  if (k === 'UGRD' || k === 'UG') return 'UG';
  if (k === 'TPG') return 'TPG';
  if (k === 'RPG') return 'RPG';
  if (k === 'PG') return 'PG';
  return k || '—';
}
function careerMatches(c, selected){
  if (!selected) return true;
  const k = careerOf(c);
  if (selected === 'UG' || selected === 'UGRD') return k === 'UGRD';
  if (selected === 'PG') return k === 'TPG' || k === 'RPG';
  return k === selected;
}
function meetingInSlot(m, slot){
  if (!slot) return true;
  if (slot === 'am') return m.end <= 12;
  if (slot === 'pm') return m.start < 18 && m.end > 12;
  if (slot === 'eve') return m.start >= 18;
  return true;
}
function sectionMatchesFilters(s, f, schedule){
  const meetings = (s && s.meetings) || [];
  if (f.days && f.days.length){
    if (!meetings.some(m => f.days.indexOf(m.day) >= 0)) return false;
  }
  if (f.slot && !meetings.some(m => meetingInSlot(m, f.slot))) return false;
  if (f.instructor){
    const q = String(f.instructor).trim().toLowerCase();
    if (q && !meetings.some(m => String(m.teacher || '').toLowerCase().indexOf(q) >= 0)) return false;
  }
  if (f.available && !(s.capacity > 0 && s.enrolled < s.capacity)) return false;
  if (f.noConflict && schedule && schedule.length && findConflicts(meetings, schedule).length) return false;
  return true;
}
function courseDays(c){
  const d = {};
  (c.sections || []).forEach(s => (s.meetings || []).forEach(m => { d[m.day] = true; }));
  return d;
}
function courseHasParallel(c){
  return parallelClassCount(c) > 1;
}
function filtersActive(f){
  return !!(f.subject || f.credits !== '' || f.career || (f.days && f.days.length) || f.slot || (f.instructor && String(f.instructor).trim()) || f.noConflict || f.available || f.hasParallel || f.hasLab || f.hasTut || f.hasPrereq);
}
function applyFilters(courses, f, schedule){
  if (!filtersActive(f)) return courses;
  return courses.filter(c => {
    if (f.subject && subjectOf(c) !== f.subject) return false;
    if (f.credits !== '' && Number(c.credits) !== Number(f.credits)) return false;
    if (f.career && !careerMatches(c, f.career)) return false;
    if (f.hasParallel && !courseHasParallel(c)) return false;
    if (f.hasLab && !(c.sections || []).some(s => s.component === 'LAB')) return false;
    if (f.hasTut && !(c.sections || []).some(s => s.component === 'TUT')) return false;

function roundRectPath(ctx, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ellipsizeText(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function exportTimetableImage(schedule, coursesById){
  const entries = (schedule || []).filter(en => en && en.course && Array.isArray(en.meetings) && en.meetings.length);
  if (!entries.length) return false;
  const S = 2;
  const TIME_COL = 70, DAY_W = 230, HEADER = 48;
  const FOOTER = 26;
  const LINE_H = 13.5;
  const items = [];
  const seen = new Set();
  entries.forEach(en => {
    for (const m of (en.meetings || [])){
      const key = en.section + '|' + m.day + '|' + m.start + '|' + m.end;
      if (seen.has(key)) continue;
      seen.add(key);
      items.push({ en: en, m: m, course: coursesById && coursesById[en.course] });
    }
  });
  let maxLines = 3, minDur = Infinity;
  items.forEach(it => {
    const m = it.m, en = it.en, course = it.course;
    let n = 3;
    if (course && course.name) n++;
    if (m.teacher || (m.instructors || []).some(i => i && i.name)) n++;
    if (course && Number(course.credits)) n++;
    if (m.startDate && m.endDate) n++;
    if (n > maxLines) maxLines = n;
    const d = m.end - m.start;
    if (d > 0 && d < minDur) minDur = d;
  });
  const HOUR_H = Math.min(340, Math.max(64, Math.ceil((maxLines * LINE_H + 16) / (minDur === Infinity ? 1 : minDur))));
  const W = TIME_COL + DAY_W * 5;
  const H = HEADER + (END_HOUR - START_HOUR + 1) * HOUR_H + FOOTER;
  const GRID_BOTTOM = HEADER + (END_HOUR - START_HOUR + 1) * HOUR_H;
  const canvas = document.createElement('canvas');
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  const FONT_UI = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const FONT_MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f6f8fb';
  ctx.fillRect(0, 0, W, HEADER);
  ctx.fillRect(0, 0, TIME_COL, H);

  ctx.strokeStyle = '#e8edf4';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++){
    const x = TIME_COL + DAY_W * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_BOTTOM); ctx.stroke();
  }
  ctx.fillStyle = '#7c8aa0';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.font = '500 10.5px ' + FONT_MONO;
  for (let h = START_HOUR; h <= END_HOUR; h++){
    const y = HEADER + (h - START_HOUR) * HOUR_H;
    ctx.fillText(String(h).padStart(2, '0') + ':00', TIME_COL - 8, y - 2);
    ctx.beginPath(); ctx.moveTo(TIME_COL, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(TIME_COL, GRID_BOTTOM); ctx.lineTo(W, GRID_BOTTOM); ctx.stroke();

  ctx.fillStyle = '#334155';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 13px ' + FONT_UI;
  DAY_LABELS.forEach((d, i) => ctx.fillText(d, TIME_COL + DAY_W * i + DAY_W / 2, HEADER / 2 + 1));

  const creditSum = scheduleCreditSummary(entries, coursesById);
  const footLeft = formatCredits(creditSum.total) + ' cr · ' + creditSum.courses + ' course' + (creditSum.courses === 1 ? '' : 's') + (creditSum.klms.courses ? ' · KLMS ' + formatCredits(creditSum.klms.total) + ' cr' : '');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, GRID_BOTTOM, W, FOOTER);
  ctx.fillStyle = '#7c8aa0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '600 11px ' + FONT_UI;
  ctx.fillText(footLeft, TIME_COL + 8, GRID_BOTTOM + FOOTER / 2 + 1);
  ctx.textAlign = 'right';
  ctx.fillText('HKUST SIS Course Planner · ' + new Date().toISOString().slice(0, 10), W - 12, GRID_BOTTOM + FOOTER / 2 + 1);

  const byDay = {};
  items.forEach(it => { (byDay[it.m.day] || (byDay[it.m.day] = [])).push(it); });
  Object.keys(byDay).forEach(d => {
    const list = byDay[d];
    const used = list.map(() => false);
    for (let i = 0; i < list.length; i++){
      if (used[i]) continue;
      const stack = [i]; used[i] = true; const group = [];
      while (stack.length){
        const u = stack.pop(); group.push(list[u]);
        for (let v = 0; v < list.length; v++){
          if (!used[v] && meetingsOverlap(list[u].m, list[v].m)){ used[v] = true; stack.push(v); }
        }
      }
      group.sort((a, b) => String(a.en.course).localeCompare(String(b.en.course)) || a.m.start - b.m.start);
      group.forEach((it, idx) => { it.lane = idx; it.lanes = group.length; });
    }
  });

  items.forEach(it => {
    const m = it.m, en = it.en, course = it.course;
    const lanes = Math.max(1, it.lanes || 1);
    const lane = it.lane || 0;
    const slotW = DAY_W / lanes;
    const x = TIME_COL + (m.day - 1) * DAY_W + lane * slotW + 2;
    const y = HEADER + (m.start - START_HOUR) * HOUR_H + 3;
    const bh = (m.end - m.start) * HOUR_H - 6;
    if (bh < 14) return;
    const col = courseColor(en.course);
    roundRectPath(ctx, x, y, slotW - 4, bh, 8);
    ctx.fillStyle = col.bg; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = col.border; ctx.stroke();
    ctx.save();
    roundRectPath(ctx, x, y, slotW - 4, bh, 8);
    ctx.clip();
    ctx.fillStyle = col.border;
    ctx.fillRect(x, y, 4, bh);
    ctx.restore();

    ctx.save();
    roundRectPath(ctx, x + 6, y + 4, slotW - 16, bh - 8, 6);
    ctx.clip();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const tx = x + 12;
    let lineY = y + 7;
    const teacher = m.teacher || (m.instructors || []).map(i => i.name).filter(Boolean).join('; ');
    const lines = [];
    lines.push({ text: en.course + ' ' + (en.label || ''), font: '800 12.5px ' + FONT_MONO, color: col.text });
    if (course && course.name) lines.push({ text: course.name, font: '700 11px ' + FONT_UI, color: '#334155' });
    lines.push({ text: fmtDec(m.start) + ' – ' + fmtDec(m.end), font: '700 11px ' + FONT_UI, color: '#334155' });
    lines.push({ text: m.room || 'TBA', font: '500 10.5px ' + FONT_UI, color: '#475569' });
    if (teacher) lines.push({ text: teacher, font: '500 10.5px ' + FONT_UI, color: '#475569' });
    if (course && Number(course.credits)) lines.push({ text: formatCredits(course.credits) + ' cr', font: '700 10.5px ' + FONT_UI, color: '#1d4ed8' });
    if (m.startDate && m.endDate) lines.push({ text: m.startDate.slice(5) + '–' + m.endDate.slice(5), font: '600 10px ' + FONT_UI, color: '#9a5b13' });
    const maxW = slotW - 26;
    for (const ln of lines){
      ctx.font = ln.font;
      ctx.fillStyle = ln.color;
      ctx.fillText(ellipsizeText(ctx, ln.text, maxW), tx, lineY);
      lineY += LINE_H;
    }
    ctx.restore();
  });

  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'timetable-' + new Date().toISOString().slice(0, 10) + '.png';
  a.click();
  return true;
}

function hourOptions(){
  const out = [];
  for (let h = START_HOUR; h <= END_HOUR; h++){
    out.push(h);
    if (h < END_HOUR) out.push(h + 0.5);
  }
  return out;
}
function courseTimeOptions(course){
  return ((course && course.sections) || []).filter(s => s.meetings && s.meetings.length).map(s => ({
    id: s.id,
    label: s.label,
    component: s.componentName || s.component || '',
    times: s.meetings.map(m => ({ day: m.day, time: m.start, end: m.end, labels: [s.label] })),
    summary: s.meetings.map(m => DAY_NAMES[m.day] + ' ' + fmtRange(m)).join(' / ')
  }));
}
function slotKey(s){ return s.id || (s.day + '-' + s.time); }
function slotLabel(s){
  const range = s.end != null ? (fmtDec(s.start != null ? s.start : s.time) + '–' + fmtDec(s.end)) : fmtDec(s.time);
  return DAY_NAMES[s.day] + ' ' + range;
}
function CourseCombo({ value, courses, used, onChange, inputRef }){

    remainBad = !nBundles;

      </div>
        </div>
      </div>

      const next = typeof updater === 'function' ? updater(cur) : updater;
      return Object.assign({}, prev, { items: next });
    });
    setResult(null);
  }
  function loadCurrent(){
    const seen = {};
    const next = [];
    (lockedSchedule || []).forEach(en => {
      if (!en || !en.course || seen[en.course]) return;
      seen[en.course] = true;
      next.push({ id: uid(), code: en.course, times: [], all: true, enabled: true });
    });
    if (!next.length) next.push({ id: uid(), code: '', times: [], all: false, enabled: true });
    setItems(next);
    setResult(null);
  }
  function generate(){
    setBusy(true);
    setResult(null);
    setTimeout(() => {
      const reqs = items.filter(it => it.code && it.enabled !== false).map(it => ({ code: it.code, times: it.all ? [] : (it.times || []) }));
      const opts = { collectLimit: 1000, showLimit: 1000, rankBy: rank, blocked: blockedPeriods || [] };
      const r = generateSchedules(reqs, coursesById, Object.assign({ locked: lockedSchedule || [] }, opts));
      setResult(r);
      setBusy(false);
    }, 30);
  }
  function addFilterSlot(){
    if (fEnd <= fStart) return;
    const slot = { day: fDay, start: fStart, end: fEnd };
    if (filterSlots.some(sl => sl.day === slot.day && sl.start === slot.start && sl.end === slot.end)) return;
    setFilterSlots(prev => prev.concat([slot]));
  }
  function pickStart(v){
    setFStart(v);
    if (v >= fEnd) setFEnd(Math.min(END_HOUR, v + 0.5));
  }
  function pickEnd(v){
    setFEnd(v);
    if (v <= fStart) setFStart(Math.max(START_HOUR, v - 0.5));
  }
  const shown = result ? result.solutions.filter(sol => {
    const entriesOf = sol.entries && sol.entries.length ? sol.entries : (sol.full || []);
    const passSlots = filterSlots.every(slot => {
      const dayMeetings = [];
      entriesOf.forEach(en => (en.meetings || []).forEach(m => { if (m.day === slot.day) dayMeetings.push(m); }));
      return dayMeetings.length > 0 && dayMeetings.every(m => slot.start <= m.start && m.end <= slot.end);
    });
    const passContains = (containsSlots || []).every(slot => {
      let hit = false;
      entriesOf.forEach(en => (en.meetings || []).forEach(m => { if (m.day === slot.day && m.start < slot.end && slot.start < m.end) hit = true; }));
      return hit;
    });
    const passBlocked = !(blockedPeriods || []).some(b => entriesOf.some(en => (en.meetings || []).some(m => m.day === b.day && m.start < b.end && b.start < m.end)));
    return passSlots && passContains && passBlocked;
  }) : [];
  const hint = mode === 'course'
    ? 'Pick a class time, or All to search every section'
    : 'Pick any clock time, keep sections that cover it';
  const help = 'Add courses from the searchable list. A generated plan adds new courses, or replaces their sections if they are already on the timetable — other classes stay untouched. In Course first, choose All to search every section and rank by evenness / walking distance. Lecture/Tutorial same-index pairing is honoured.';
  return (
    <div>
      <div className="mode-switch">
        <span className="mode-label">Pin by</span>
        <div className="switch">
          <button type="button" className={mode === 'time' ? 'on' : ''} onClick={() => setMode('time')}>Time first</button>
          <button type="button" className={mode === 'course' ? 'on' : ''} onClick={() => setMode('course')}>Course first</button>
        </div>
        <span className="switch-hint">{hint}</span>
      </div>
      {mode === 'course' ? (
        <div className="mode-switch">
          <span className="mode-label">Rank by</span>
          <div className="switch">
            <button type="button" className={rank === 'even' ? 'on' : ''} onClick={() => setRank('even')}>Evenness first</button>
            <button type="button" className={rank === 'distance' ? 'on' : ''} onClick={() => setRank('distance')}>Distance first</button>
          </div>
          <span className="switch-hint">{rank === 'distance' ? 'Penalize 10-minute transfers across buildings first' : 'Spread daily hours first, then prefer same-building transfers'}</span>
        </div>
      ) : null}
      <div className="sched-help">{help}</div>
      <div className="sched-rows">
        {items.map((it, i) => (
          <SchedCourseRow key={it.id} item={it} courses={courses} used={used} mode={mode}
            inputRef={i === 0 ? firstRef : null}
            onChange={(next) => setItems(prev => prev.map(x => x.id === it.id ? next : x))}
            onRemove={() => setItems(prev => prev.filter(x => x.id !== it.id))} />
        ))}
        <button className="sched-add" onClick={() => setItems(prev => prev.concat([{ id: uid(), code: '', times: [], enabled: true }]))}>+ Add course</button>
      </div>
      <div className="sched-actions">
        <button className="sched-btn" onClick={generate} disabled={busy || !items.some(it => it.code && it.enabled !== false)}>{busy ? 'Generating…' : 'Generate Schedule'}</button>
        <button className="sched-btn ghost" type="button" onClick={loadCurrent} disabled={busy || !(lockedSchedule && lockedSchedule.length)} title="Fill the list with courses currently on the timetable">Load current</button>
        <span className="sched-note">{items.filter(it => it.code && it.enabled !== false).length} course(s) selected</span>
      </div>
      {containsSlots.length ? (
        <div className="sched-filter">
          <span className="sched-note">Must include classes in (timetable right-drag box):</span>
          {containsSlots.map((sl, i) => (
            <span className="tchip" key={'c' + i}>
              {DAY_NAMES[sl.day]} {fmtDec(sl.start)}–{fmtDec(sl.end)}
              <button type="button" onClick={() => onContainsChange(containsSlots.filter((_, j) => j !== i))}>×</button>
            </span>
          ))}
          <button className="sbtn ghost" onClick={() => onContainsChange([])}>Clear</button>
          {!result ? <span className="sched-note">Generate to apply this filter</span> : null}
        </div>
      ) : null}
      {blockedPeriods.length ? (
        <div className="sched-filter">
          <span className="sched-note">Blocked periods (timetable left-drag box) — plans avoid them:</span>
          {blockedPeriods.map(b => (
            <span className="tchip bad" key={b.id}>{DAY_NAMES[b.day]} {fmtDec(b.start)}–{fmtDec(b.end)}</span>
          ))}
        </div>
      ) : null}
      {result ? (
        <div>
          {result.solutions.length ? (
            <div className="sched-filter">
              <span className="sched-note">Filter plans by day window:</span>
              <select value={fDay} onChange={(e) => setFDay(Number(e.target.value))}>
                {[[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri']].map(p => <option key={p[0]} value={p[0]}>{p[1]}</option>)}
              </select>
              <select value={fStart} onChange={(e) => pickStart(Number(e.target.value))}>
                {hourOptions().map(h => <option key={h} value={h}>{fmtDec(h)}</option>)}
              </select>
              <span className="sched-note">to</span>
              <select value={fEnd} onChange={(e) => pickEnd(Number(e.target.value))}>
                {hourOptions().map(h => <option key={h} value={h}>{fmtDec(h)}</option>)}
              </select>
              <button className="sbtn" onClick={addFilterSlot} disabled={fEnd <= fStart}>Add period</button>
              {fEnd <= fStart ? <span className="sched-note bad">End must be after start</span> : null}
              {filterSlots.map((sl, i) => (
                <span className="tchip" key={i}>
                  {DAY_NAMES[sl.day]} {fmtDec(sl.start)}–{fmtDec(sl.end)}
                  <button type="button" onClick={() => setFilterSlots(prev => prev.filter((_, j) => j !== i))}>×</button>
                </span>
              ))}
              {filterSlots.length ? <button className="sbtn ghost" onClick={() => setFilterSlots([])}>Clear</button> : null}
              {(filterSlots.length || containsSlots.length || blockedPeriods.length) ? <span className="sched-note">Showing {shown.length} of {result.solutions.length} plan{result.solutions.length === 1 ? '' : 's'}</span> : null}
              <span className="sched-note">All classes on that day must fit inside the period</span>
            </div>
          ) : null}
          {result.warnings.length ? (
            <div className="warn">{result.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>
          ) : null}
          {!result.solutions.length && !result.truncated ? (
            <div className="warn bad">No conflict-free schedule found for these courses.</div>
          ) : null}
          {result.truncated ? <div className="warn">Search space exceeded — showing partial results.</div> : null}
          {result.found ? (
            <div className="sched-note" style={{ marginTop: 8 }}>{result.found} conflict-free timetable{result.found === 1 ? '' : 's'} found.</div>
          ) : null}
          {!shown.length && result.solutions.length ? (
            <div className="warn">No plans fit the current filters — adjust or clear them.</div>
          ) : null}
          {shown.map((sol, i) => (
            <div className="solution" key={i}>
              <h4>
                Plan {i + 1}
                <button className="sbtn sol-apply" onClick={() => onApply(sol, items.filter(it => it.code && it.enabled !== false).map(it => it.code))}>Add to timetable</button>
              </h4>
              {sol.even ? (
                <div className="sol-metrics">
                  <span className="metric">Evenness σ {fmtHours(sol.even.std)}</span>
                  <span className={'metric' + (sol.dist && sol.dist.far ? ' bad' : ' good')}>Cross-building {sol.dist ? sol.dist.far : 0}</span>
                  <span className="metric good">Same building {sol.dist ? sol.dist.same : 0}</span>
                  {sol.dist && sol.dist.pairs ? <span className="metric">10-min transfers {sol.dist.pairs}</span> : null}
                </div>
              ) : null}
              {sol.even ? (
                <div className="sol-days">Daily hours (full timetable): {['Mon','Tue','Wed','Thu','Fri'].map((d, di) => d + ' ' + fmtHours(sol.even.hours[di])).join(' · ')}</div>
              ) : null}
              <div className="sol-days">Adds the classes below, or replaces them if already on the timetable. Other classes stay.</div>
              {lockedSchedule && lockedSchedule.length ? (
                <div className="sol-days">Current: {lockedSchedule.map(en => en.course + ' ' + en.label).join(' · ')}</div>
              ) : null}
              {(Array.isArray(sol.entries) ? sol.entries : sol).map(en => (
                <div className="sol-row" key={en.section}>
                  <span className="sol-code">{en.course}</span>
                  <span className="sol-sec">{en.label}</span>
                  <span className="sol-time">{summaryOf(en.meetings)}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      ) : null}
    </div>
  );
}

function DepsTab({ initialCode, courses, coursesById, catalogMap, names, onJump }){
  const [input, setInput] = React.useState(initialCode || '');
  const [code, setCode] = React.useState(normCode(initialCode || ''));
  const offered = new Set(courses.map(c => c.code));
  const course = code
    ? (coursesById[code] || (catalogMap[code] ? { code: code, name: catalogMap[code].crseTitle || '', prereq: cleanField(catalogMap[code].crsePrerequisite), coreq: cleanField(catalogMap[code].crseCorequisite) } : null))
    : null;
  const parse = React.useMemo(() => course ? parsePrereq(course.prereq) : null, [course]);
  function go(c){ setCode(normCode(c)); setInput(c); }
  return (
    <div>
      <div className="deps-controls">
        <input className="deps-input" list="deps-codes" value={input} spellCheck={false}
          placeholder="Course code, e.g. DSAA3073"
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') go(input); }} />
        <datalist id="deps-codes">
          {courses.map(c => <option key={c.code} value={c.code} />)}
        </datalist>
        <button className="sbtn add" onClick={() => go(input)}>Load</button>
      </div>
      {!code ? (
        <div className="dep-canvas"><div className="dep-note">Enter a course code to see its prerequisite graph.</div></div>
      ) : !course ? (
        <div className="warn bad">Unknown course code "{code}" — not found in courses.json or data.json.</div>
      ) : (
        <div>
          <div className="deps-card">
            <div className="dc-title">{course.code}{course.name ? ' — ' + course.name : ''}</div>
            {offered.has(code) ? null : <div className="dc-sub">Catalog record only (not offered in the current term).</div>}
            {parse && parse.raw ? <div className="deps-raw">{parse.raw}</div> : null}
            {parse && parse.ok ? <div className="deps-summary">{astString(parse.node)}</div> : null}
            {parse && parse.approximate ? <div className="deps-ignored">⚠ Parsed approximately — the original text does not follow a strict boolean structure.</div> : null}
            {parse && parse.ignored.length ? <div className="deps-ignored">Non-course text ignored: {parse.ignored.join(' · ')}</div> : null}
            {course.coreq ? <div className="deps-card" style={{ marginTop: 8 }}><div className="dc-title">Corequisite</div><div className="deps-raw">{course.coreq}</div></div> : null}
          </div>
          {!parse || !parse.ok ? (
            <div className="dep-canvas"><div className="dep-note">
              {course.prereq
                ? 'This prerequisite is described in prose without parseable course codes.'
                : 'No prerequisite listed for this course.'}
            </div></div>
          ) : (
            <DepGraph key={'g' + code} courseCode={code} courseName={course.name} ast={parse.node} names={names} onJump={onJump} />
          )}
          <div className="deps-ignored" style={{ marginTop: 8 }}>Tip: click any course node to jump to its own dependency graph. Drag nodes / scroll to zoom.</div>
        </div>
      )}
    </div>
  );
}

function CartIcon(){

function groupCart(schedule, coursesById){
  const map = {};
  (schedule || []).forEach(en => {
    if (!en || !en.course) return;
    if (!map[en.course]){
      const c = coursesById && coursesById[en.course];
      map[en.course] = { code: en.course, name: c ? c.name : '', credits: c ? (Number(c.credits) || 0) : 0, klms: !!(c && c.klms), entries: [] };
    }
    map[en.course].entries.push(en);
  });
  return Object.keys(map).sort().map(k => map[k]);
}
function CartFab({ schedule, coursesById, open, onToggle, onClose, onOpenCourse, onRemoveSection, onRemoveCourse }){
  const wrapRef = React.useRef(null);
  const [cartTab, setCartTab] = React.useState('sis');
  const groups = React.useMemo(() => groupCart(schedule, coursesById), [schedule, coursesById]);
  const creditSum = React.useMemo(() => scheduleCreditSummary(schedule, coursesById), [schedule, coursesById]);
  const sisGroups = React.useMemo(() => groups.filter(g => !g.klms), [groups]);
  const klmsGroups = React.useMemo(() => groups.filter(g => g.klms), [groups]);
  const activeGroups = cartTab === 'klms' ? klmsGroups : sisGroups;
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [open, onClose]);
  return (
    <div className="cart-wrap" ref={wrapRef}>
      {open ? (
        <div className="cart-panel">
          <div className="cart-head">
            <h3>Selected courses</h3>
            <span className="cart-cr">{formatCredits(creditSum.total)} cr</span>

          <div className="cart-tabs">

              Courses · {sisGroups.length} · {formatCredits(creditSum.sis.total)} cr
            </button>
            <button type="button" className={cartTab === 'klms' ? 'on' : ''} onClick={() => setCartTab('klms')}>
              KLMS · {klmsGroups.length} · {formatCredits(creditSum.klms.total)} cr
            </button>
          </div>
          <div className="cart-list">
            {!activeGroups.length ? <div className="cart-empty">{cartTab === 'klms' ? 'No KLMS courses in the timetable yet.' : 'No courses in the timetable yet.'}</div> : null}
            {activeGroups.map(g => (
              <div className="cart-item" key={g.code}>
                <div className="cart-item-top">
                  <button className="cart-item-code" onClick={() => onOpenCourse(g.code)}>{g.code}</button>
                  <span className="cart-item-cr">{formatCredits(g.credits)} cr</span>
                  <button className="cart-item-rm" onClick={() => onRemoveCourse(g.code)}>Remove</button>
                </div>
                {g.name ? <div className="cart-item-name">{g.name}</div> : null}
                {g.entries.map(en => (
                  <div className="cart-sec" key={en.section}>
                    <b>{en.label}</b>
                    <span>{summaryOf(en.meetings)}</span>
                    <button className="cart-x" title="Remove section" onClick={() => onRemoveSection(en.section)}>✕</button>
                  </div>
                ))}
              </div>
            ))}

      <button className="cart-fab" onClick={onToggle} title="View selected courses" aria-label="Selected courses">
        <CartIcon />
        {groups.length ? <span className="cart-badge">{groups.length}</span> : null}
      </button>
    </div>
  );
}

    const id = uid();

  function applyLoadedData(rawCourses, rawCatalog, labels, rawKlms){
    const cm = buildCatalog(rawCatalog || []);
    const klmsRaw = rawKlms !== undefined ? (rawKlms || []) : (rawKlmsRef.current || []);
    const cs = mergeCourses(normalizeCourses(Array.isArray(rawCourses) ? rawCourses : [], cm), normalizeKlmsCourses(klmsRaw, cm));
    if (!cs.length) throw new Error('no courses could be parsed');
    rawCoursesRef.current = rawCourses;
    rawCatalogRef.current = rawCatalog;
    rawKlmsRef.current = klmsRaw;
    setCatalogMap(cm);
    setCourses(cs);
    setDataLabels(Object.assign({ courses: 'courses.json', catalog: 'data.json', klms: 'courses_klms.json' }, labels || {}));
    setSelected(null);
    const ids = {};
    cs.forEach(c => c.sections.forEach(s => { ids[s.id] = true; }));
    setSchedule(prev => prev.filter(en => ids[en.section]));
  }
  function readJsonFile(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => { try { resolve(JSON.parse(r.result)); } catch (ex){ reject(ex); } };
      r.onerror = () => reject(new Error('read failed'));
      r.readAsText(file);
    });
  }
  async function onPickCustom(kind, e){
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try{
      const data = await readJsonFile(f);
      if (kind === 'courses'){
        if (!Array.isArray(data)) throw new Error('courses file must be a JSON array');
        applyLoadedData(data, rawCatalogRef.current, { courses: f.name, catalog: dataLabels.catalog });
        toast('Loaded course data · ' + f.name);
      } else if (kind === 'klms'){
        if (!Array.isArray(data)) throw new Error('KLMS file must be a JSON array');
        applyLoadedData(rawCoursesRef.current, rawCatalogRef.current, { courses: dataLabels.courses, catalog: dataLabels.catalog, klms: f.name }, data);
